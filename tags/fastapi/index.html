<style>
  html { scroll-behavior: smooth; }

  .post-toc { margin: 1.5rem 0; font-size: 0.9rem; line-height: 1.5; font-family: 'Lato', sans-serif; }
  .post-toc summary { cursor: pointer; font-weight: 700; color: #222; }
  .post-toc ul { list-style: none; margin: 0.5rem 0 0; padding: 0; }
  .post-toc ul ul { padding-left: 1rem; }
  .post-toc li { margin: 0.2rem 0; }
  .post-toc a { color: #777; text-decoration: none; }
  .post-toc a:hover { color: #111; }
  .post-toc a.is-active { color: #000; font-weight: 600; }

  .post-toc a {
    color: #777;
    text-decoration: none;
    transition: background 150ms ease, color 150ms ease;
  }
   
  .post-toc a:hover,
  .post-toc a.is-active {
    color: #111;
    background: #CBF8DF;
    box-shadow: 0 0 0 2px #CBF8DF;  
    border-radius: 2px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .post-toc a.is-active { font-weight: 600; }

   
  @media (min-width: 1200px) {
    .post-toc {
      position: fixed;
      top: 6rem;
      left: calc(50vw - 600px);  
      width: 190px;
      max-height: calc(100vh - 8rem);
      overflow-y: auto;          
      margin: 0;
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .post-toc summary {
      cursor: default;
      pointer-events: none;      
      list-style: none;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }
    .post-toc summary::-webkit-details-marker { display: none; }
  }
</style>

<script>
  
  (function () {
    document.addEventListener('DOMContentLoaded', function () {
      var toc = document.querySelector('.post-toc');
      if (!toc) return;
      var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
      var map = {}, headings = [];
      links.forEach(function (a) {
        var id = decodeURIComponent(a.getAttribute('href').slice(1));
        var h = document.getElementById(id);
        if (h) { map[id] = a; headings.push(h); }
      });
      if (!headings.length) return;

      function setActive(id) {
        for (var k in map) map[k].classList.toggle('is-active', k === id);
      }
      function onScroll() {
        var current = '';
        for (var i = 0; i < headings.length; i++) {
          if (headings[i].getBoundingClientRect().top <= 80) current = headings[i].id;
          else break;
        }
        setActive(current);
      }
      var ticking = false;
      window.addEventListener('scroll', function () {
        if (!ticking) {
          ticking = true;
          window.requestAnimationFrame(function () { onScroll(); ticking = false; });
        }
      }, { passive: true });
      onScroll();
    });
  })();
</script>
